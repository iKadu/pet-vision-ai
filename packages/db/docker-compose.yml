name: tccpet

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tccpet-postgres
    environment:
      POSTGRES_DB: tccpet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - tccpet_postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  tccpet_postgres_data:
